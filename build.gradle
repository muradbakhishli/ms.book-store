plugins {
    id "java"
    id "org.springframework.boot" version "$springBootVersion"
    id "io.spring.dependency-management" version "$dependencyManagementVersion"
    id "groovy"
}

group = "az.ingress"
sourceCompatibility = "17"

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //spring
    implementation "org.springframework.boot:spring-boot-starter-web"

    //lombok
    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    //spring-security
    implementation "org.springframework.boot:spring-boot-starter-security"

    //validation
    implementation "org.springframework.boot:spring-boot-starter-validation"

    //spring-data-jpa
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"

    //postgres
    runtimeOnly "org.postgresql:postgresql"

    //liquibase
    implementation "org.liquibase:liquibase-core"

    //redisson
    implementation "org.redisson:redisson-spring-boot-starter:${redisVersion}"

    //jwt
    implementation "com.nimbusds:nimbus-jose-jwt:${jwtVersion}"

    //un-named
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    implementation "com.fasterxml.jackson.core:jackson-databind:${jaksonDataBindVersion}"

    //swagger
    implementation "org.springdoc:springdoc-openapi-ui:$openApiVersion"

    //testing
    testImplementation "org.apache.groovy:groovy:$groovyVersion"
    testImplementation "io.github.benas:random-beans:$randomBeansVersion"
    testImplementation "org.spockframework:spock-spring:$spockSpringVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

test {
    useJUnitPlatform()
}