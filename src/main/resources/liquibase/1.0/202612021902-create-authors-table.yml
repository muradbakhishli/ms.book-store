databaseChangeLog:
  - changeSet:
      id: 202612021902
      author: Murad Baxisli
      changes:
        - createTable:
            tableName: authors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: age
                  type: INT
                  constraints:
                    nullable: false