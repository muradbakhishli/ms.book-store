databaseChangeLog:
  - changeSet:
      id: 202612021852
      author: Murad Baxisli
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: is_account_non_expired
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: is_account_non_locked
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                    name: is_credentials_non_expired
                    type: boolean
                    constraints:
                      nullable: false
              - column:
                  name: is_enabled
                  type: boolean
                  constraints:
                    nullable: false