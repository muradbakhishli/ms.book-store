databaseChangeLog:
  - changeSet:
      id: 202612021920
      author: Murad Baxisli
      changes:
        - createTable:
            tableName: students_books
            columns:
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_students_books
                    references: students(id)
                    nullable: false
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_books_students
                    references: books(id)
                    nullable: false