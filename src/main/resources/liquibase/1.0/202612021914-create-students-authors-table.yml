databaseChangeLog:
  - changeSet:
      id: 202612021914
      author: Murad Baxisli
      changes:
        - createTable:
            tableName: students_authors
            columns:
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_students_authors
                    references: students(id)
                    nullable: false
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_authors_students
                    references: authors(id)
                    nullable: false