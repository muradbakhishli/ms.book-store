server:
  port: 8080

spring:
  application:
    name: ms.book-store


  datasource:
    url: jdbc:postgresql://${DB_CONNECTION_IP:localhost}:${DB_CONNECTION_HOST:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
      format_sql: true
  liquibase:
    change-log: classpath:liquibase/changelog-master.yml
#    drop-first: true



jwt:
  access-token:
    expiration:
      time: 15
  refresh-token:
    expiration:
      time: 21600
      count: 50

redis:
  server:
    url: redis://${REDIS_CONNECTION_IP:localhost}:${REDIS_CONNECTION_PORT:6379}
